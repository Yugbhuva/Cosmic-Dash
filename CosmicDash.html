<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Dash</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5246796901891799"
     crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            touch-action: none; /* Prevent browser scrolling/zooming */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .interactive-ui {
            pointer-events: auto;
        }
        .hidden {
            display: none !important;
        }
        
        /* Neon Glow Effects */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ea5e9, 0 0 30px #0ea5e9;
        }
        .btn-primary {
            background: linear-gradient(45deg, #0ea5e9, #2563eb);
            border: 2px solid #60a5fa;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div class="ui-layer">
        <!-- HUD -->
        <div id="hud" class="flex justify-between items-start w-full">
            <div class="text-white font-bold text-xl drop-shadow-md">
                SCORE: <span id="scoreDisplay" class="text-cyan-400">0</span>
            </div>
            <div class="text-white font-bold text-sm bg-slate-800/50 px-2 py-1 rounded">
                High Score: <span id="highScoreDisplay" class="text-yellow-400">0</span>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm interactive-ui z-10">
            <h1 class="text-5xl md:text-7xl font-black text-white mb-2 tracking-tighter italic neon-text text-center">COSMIC<br>DASH</h1>
            <p class="text-slate-300 mb-8 text-center max-w-xs">Drag to move. Dodge the red meteors. Collect blue energy.</p>
            <button id="startBtn" class="btn-primary text-white font-bold py-4 px-12 rounded-full text-xl uppercase tracking-widest">
                Play
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 backdrop-blur-md interactive-ui z-20">
            <h2 class="text-5xl font-black text-white mb-2 neon-text">CRASHED!</h2>
            <div class="text-white text-xl mb-6">Final Score: <span id="finalScore" class="font-bold text-yellow-300">0</span></div>
            <button id="restartBtn" class="btn-primary text-white font-bold py-4 px-12 rounded-full text-xl uppercase tracking-widest">
                Retry
            </button>
        </div>
    </div>

    <script>
        // Game Configuration
        const config = {
            playerSpeed: 0.15,
            asteroidSpeedBase: 3,
            spawnRateBase: 60, 
            spawnRateMin: 20,
            energySpawnRate: 150, // Frames between energy spawns
        };

        // State
        const state = {
            isPlaying: false,
            score: 0,
            highScore: parseInt(localStorage.getItem('cosmicDash_highScore')) || 0,
            frames: 0,
            speedMultiplier: 1,
            touchX: null,
            targetX: null
        };

        // Game Entities - MOVED UP HERE to avoid ReferenceError
        let player;
        let asteroids = [];
        let energyOrbs = [];
        let particles = [];
        let stars = [];

        // Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        highScoreDisplay.innerText = state.highScore;

        // Resize Handling
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Reset player position on resize
            if (player) {
                player.y = height - 100;
                if (!state.isPlaying) player.x = width / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        class Player {
            constructor() {
                this.width = 40;
                this.height = 60;
                this.x = width / 2;
                this.y = height - 100;
                this.color = '#0ea5e9'; // Cyan 500
                this.enginePower = 0;
            }

            update() {
                if (state.targetX !== null) {
                    this.x += (state.targetX - this.x) * config.playerSpeed;
                }

                // Boundary checks
                if (this.x < this.width/2) this.x = this.width/2;
                if (this.x > width - this.width/2) this.x = width - this.width/2;
                
                this.enginePower = Math.random() * 20 + 10;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Engine Flame
                ctx.beginPath();
                ctx.moveTo(-10, 20);
                ctx.lineTo(0, 20 + this.enginePower);
                ctx.lineTo(10, 20);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-5, 20);
                ctx.lineTo(0, 20 + (this.enginePower * 0.6));
                ctx.lineTo(5, 20);
                ctx.fillStyle = '#fff';
                ctx.fill();

                // Ship Body
                ctx.beginPath();
                ctx.moveTo(0, -30);
                ctx.lineTo(20, 20);
                ctx.lineTo(0, 10);
                ctx.lineTo(-20, 20);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fill();
                
                // Cockpit
                ctx.beginPath();
                ctx.ellipse(0, -5, 5, 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#1e293b';
                ctx.fill();

                ctx.restore();
            }
        }

        class Asteroid {
            constructor() {
                this.radius = Math.random() * 20 + 15; 
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -50;
                this.speed = (Math.random() * 2 + config.asteroidSpeedBase) * state.speedMultiplier;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.vertices = [];
                const numVerts = 8;
                for(let i=0; i<numVerts; i++) {
                    const angle = (i / numVerts) * Math.PI * 2;
                    const r = this.radius * (0.8 + Math.random() * 0.4);
                    this.vertices.push({
                        x: Math.cos(angle) * r,
                        y: Math.sin(angle) * r
                    });
                }
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for(let i=1; i<this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                
                ctx.fillStyle = '#ef4444'; // Red
                ctx.shadowColor = '#b91c1c';
                ctx.shadowBlur = 5;
                ctx.fill();
                
                // Crater
                ctx.beginPath();
                ctx.arc(this.radius * 0.3, -this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();

                ctx.restore();
            }
        }

        class EnergyOrb {
            constructor() {
                this.radius = 12;
                this.x = Math.random() * (width - this.radius * 2) + this.radius;
                this.y = -50;
                this.speed = (Math.random() + config.asteroidSpeedBase) * state.speedMultiplier * 0.8;
                this.wobbleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * 0.05 + this.wobbleOffset) * 1.5; // Slight wobble
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6'; // Blue 500
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 15;
                ctx.fill();
                
                // Core
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                ctx.restore();
            }
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 3 + 0.5; 
                this.opacity = Math.random();
            }

            update() {
                this.y += this.speed * (1 + (state.speedMultiplier - 1) * 0.5); 
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }
        }

        // Input Handling
        function handleInput(x) {
            state.targetX = x;
        }

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            if(state.isPlaying) handleInput(e.clientX);
        });

        window.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;
            const step = 20;
            if (state.targetX === null) state.targetX = player.x;
            if (e.key === 'ArrowLeft') state.targetX -= step * 3;
            if (e.key === 'ArrowRight') state.targetX += step * 3;
            if (state.targetX < 0) state.targetX = 0;
            if (state.targetX > width) state.targetX = width;
        });

        // Game Logic
        function initGame() {
            player = new Player();
            asteroids = [];
            energyOrbs = [];
            particles = [];
            state.score = 0;
            state.speedMultiplier = 1;
            state.frames = 0;
            scoreDisplay.innerText = 0;
            state.targetX = width / 2;
            
            stars = [];
            for(let i=0; i<50; i++) stars.push(new Star());
        }

        function createExplosion(x, y, color1, color2) {
            for(let i=0; i<15; i++) {
                particles.push(new Particle(x, y, color1));
                particles.push(new Particle(x, y, color2));
            }
        }

        function gameOver() {
            state.isPlaying = false;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('cosmicDash_highScore', state.highScore);
                highScoreDisplay.innerText = state.highScore;
            }
            finalScoreDisplay.innerText = state.score;
            createExplosion(player.x, player.y, '#ef4444', '#f59e0b');
            
            canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
            setTimeout(() => canvas.style.transform = 'none', 200);

            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 500);
        }

        function loop() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            if (state.isPlaying) {
                state.frames++;
                state.score++;
                if(state.frames % 10 === 0) scoreDisplay.innerText = state.score;

                state.speedMultiplier += 0.0001;
                
                // Spawn Asteroids
                const spawnRate = Math.max(config.spawnRateMin, config.spawnRateBase - (state.speedMultiplier * 5));
                if (state.frames % Math.floor(spawnRate) === 0) {
                    asteroids.push(new Asteroid());
                }

                // Spawn Energy Orbs
                if (state.frames % config.energySpawnRate === 0) {
                    energyOrbs.push(new EnergyOrb());
                }

                player.update();
                player.draw();

                // Energy Orb Logic
                for (let i = energyOrbs.length - 1; i >= 0; i--) {
                    const e = energyOrbs[i];
                    e.update();
                    e.draw();

                    // Collision with Player
                    const dx = e.x - player.x;
                    const dy = e.y - player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < e.radius + player.width/2) {
                        state.score += 200; // Bonus points
                        scoreDisplay.innerText = state.score;
                        createExplosion(e.x, e.y, '#3b82f6', '#fff'); // Blue explosion
                        energyOrbs.splice(i, 1);
                        continue;
                    }

                    if (e.y > height + 50) energyOrbs.splice(i, 1);
                }

                // Asteroid Logic
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    const a = asteroids[i];
                    a.update();
                    a.draw();

                    const dx = a.x - player.x;
                    const dy = a.y - player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < a.radius + player.width/2 - 5) {
                        gameOver();
                    }

                    if (a.y > height + 50) asteroids.splice(i, 1);
                }
            } else {
                if (player && particles.length === 0) player.draw(); 
                asteroids.forEach(a => a.draw());
                energyOrbs.forEach(e => e.draw());
            }

            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            initGame();
            state.isPlaying = true;
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            initGame();
            state.isPlaying = true;
        });

        initGame();
        loop();

    </script>
</body>
</html>
